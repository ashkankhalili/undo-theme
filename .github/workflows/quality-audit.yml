name: WordPress quality audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-checks:
    name: Theme Check and Plugin Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated WordPress
        run: npx --yes @wordpress/env start
      - name: Install official checkers
        run: |
          npx --yes @wordpress/env run cli wp theme activate undo-theme
          npx --yes @wordpress/env run cli wp plugin install theme-check plugin-check --activate
      - name: Run checks and retain their full results
        id: checks
        continue-on-error: true
        run: |
          mkdir -p audit-results
          set +e
          npx --yes @wordpress/env run cli wp theme-check run undo-theme --format=json > audit-results/theme-check.json 2> audit-results/theme-check.stderr
          theme_status=$?
          npx --yes @wordpress/env run cli wp plugin check undo-elements > audit-results/plugin-check.txt 2> audit-results/plugin-check.stderr
          plugin_status=$?
          set -e
          printf 'Theme Check exit: %s\nPlugin Check exit: %s\n' "$theme_status" "$plugin_status" | tee audit-results/status.txt
          if [ "$theme_status" -ne 0 ]; then
            echo 'Theme Check findings:'
            cat audit-results/theme-check.json audit-results/theme-check.stderr
          fi
          if [ "$plugin_status" -ne 0 ]; then
            echo 'Plugin Check findings:'
            cat audit-results/plugin-check.txt audit-results/plugin-check.stderr
          fi
          test "$theme_status" -eq 0 && test "$plugin_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-quality-audit
          path: audit-results/
          if-no-files-found: warn
      - name: Stop isolated WordPress
        if: always()
        run: npx --yes @wordpress/env stop

  coding-standards:
    name: WordPress PHP coding standards baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Install official WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev 'wp-coding-standards/wpcs:^3.0' --no-interaction
      - name: Capture theme and addon findings
        continue-on-error: true
        run: |
          mkdir -p audit-results
          phpcs="$(composer global config bin-dir --absolute)/phpcs"
          set +e
          "$phpcs" --standard=WordPress --extensions=php -s undo-theme undo-elements > audit-results/phpcs-full.txt 2>&1
          phpcs_status=$?
          "$phpcs" --standard=WordPress --extensions=php --report=summary undo-theme undo-elements > audit-results/phpcs-summary.txt 2>&1
          set -e
          printf 'WordPress Coding Standards exit: %s\n' "$phpcs_status"
          cat audit-results/phpcs-summary.txt
          test "$phpcs_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-phpcs-baseline
          path: audit-results/
          if-no-files-found: warn
